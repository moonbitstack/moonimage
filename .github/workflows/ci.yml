name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all

      - name: moon test (all backends)
        run: moon test --target all

      - name: examples run
        if: runner.os == 'Linux'
        run: |
          for dir in src/examples/*/; do
            if grep -q 'kind: "executable"' "$dir/moon.pkg" && ! grep -q 'supported_targets = "js"' "$dir/moon.pkg"; then
              moon run "$dir" --target native > /dev/null
            fi
          done

      - name: lint (fmt is clean)
        run: |
          moon fmt && git diff --exit-code

      - name: interfaces are up to date
        run: |
          moon info --target all && git diff --exit-code

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

  # Three implementations, one picture: the formats this library writes have to be
  # read back by Pillow and by the `image` crate to the same samples, and the
  # official samples of libtiff, openexr-images and Netpbm have to decode to what
  # those readers decode them to. Linux only: the two references are wheels and a
  # crate, and the corpora are fetched once per commit.
  samples:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: post install
        run: |
          moon version --all
          moon update

      # A virtual environment, because a distribution Python refuses a plain
      # install now, and because the samples script reads whichever python3 is
      # first on the path.
      - name: the two references
        run: |
          python3 -m venv "$RUNNER_TEMP/references"
          "$RUNNER_TEMP/references/bin/pip" install --quiet pillow numpy OpenEXR tifffile
          echo "$RUNNER_TEMP/references/bin" >> $GITHUB_PATH

      - name: the pictures
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/moonimage-samples
          key: samples-${{ hashFiles('scripts/samples/fetch.py') }}

      - name: the crate that reads them
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scripts/samples/read_image/target
          key: reader-${{ hashFiles('scripts/samples/read_image/Cargo.toml') }}

      - name: fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/samples/fetch.py

      - name: check
        run: python3 scripts/samples/check.py

      # The bound the filter tests are held to, and the measurement behind it:
      # the same picture through both implementations, counted pixel by pixel.
      - name: the filters, counted against Pillow
        run: |
          python3 scripts/samples/filters.py | tee "$RUNNER_TEMP/filters.txt"
          {
            echo "### moonimage — resampling and blur against Pillow"
            echo ""
            cat "$RUNNER_TEMP/filters.txt"
          } >> "$GITHUB_STEP_SUMMARY"
